# Publish a verifiable release archive of the client bundle.
#
# The browser fetches the release metadata from api.github.com over TLS, takes
# the asset's `digest` field and refuses to install anything whose SHA-256 does
# not match it. That digest is computed by GitHub when the asset is uploaded,
# not supplied here and not carried alongside the archive: an archive and a
# checksum published by the same uploader are attested by the same party, which
# is worth nothing. Nothing in this workflow may therefore write a checksum of
# its own into the release, or the browser would be invited to trust it.
#
# This job is the trusted publisher of code the browser then runs with full
# control of itself, so two rules hold throughout. No value derived from a ref
# is ever interpolated into a `run:` script -- a tag may legally contain shell
# metacharacters, and a GitHub expression is substituted before the shell parses
# the script -- and every action is pinned to a full commit SHA, which is the
# only immutable reference GitHub offers.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # only to create the release and upload its asset

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0   # the bundle stamp reads the commit date

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Name the release
        id: name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The grammar is the gate, not an assumption. Anything outside it -- a
          # tag carrying shell metacharacters, an apostrophe, a newline -- stops
          # the release here rather than reaching a shell or a release title.
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?$' || {
            echo "refusing to release from tag '$TAG': expected v<YYYY>.<MM>.<DD> or v<YYYY>.<MM>.<DD>.<n>" >&2
            exit 1
          }

          version="${TAG#v}"
          {
            printf 'tag=%s\n'     "$TAG"
            printf 'version=%s\n' "$version"
            printf 'archive=dragonfly-%s.zip\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        env:
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
        run: ./build.sh --revision "$VERSION" -t "$TAG"

      - name: Assemble the archive
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
        run: |
          set -eu
          # Exactly the files the browser stages, in the layout it stages them
          # in, so that unpacking this over an installed client replaces it
          # rather than merging into it. defs/ and fall-back-urls.json are build
          # products the client does not read at run time and are left out.
          staging="$(mktemp -d)/dragonfly"
          mkdir -p "$staging/script" "$staging/style"
          cp build/AUTHORS             "$staging/AUTHORS"
          cp build/client-en.xml       "$staging/client-en.xml"
          cp build/client.xml          "$staging/client.xml"
          cp build/script/dragonfly.js "$staging/script/dragonfly.js"
          cp build/style/dragonfly.css "$staging/style/dragonfly.css"
          # Named Apache-2.0 rather than LICENSE, because that is the name the
          # browser's bundled copy carries and the two layouts have to agree.
          cp LICENSE                   "$staging/Apache-2.0"

          # Timestamps come from the tagged commit rather than the clock, so a
          # rebuild of one tag on this runner image yields the same bytes; -X
          # drops the extra attributes that vary between machines.
          stamp="$(git log -1 --format=%cd --date=format-local:%Y%m%d%H%M.%S)"
          TZ=UTC find "$staging" -exec touch -t "$stamp" {} +

          ( cd "$(dirname "$staging")" && zip -X -r -q "$OLDPWD/$ARCHIVE" dragonfly )

          echo "--- archive contents ---"
          unzip -l "$ARCHIVE"
          echo "sha256: $(sha256sum "$ARCHIVE" | cut -d' ' -f1)"

      - name: Check the archive against the staged layout
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
        run: |
          set -eu
          cat > /tmp/expected-layout <<'LAYOUT'
          dragonfly/
          dragonfly/Apache-2.0
          dragonfly/AUTHORS
          dragonfly/client-en.xml
          dragonfly/client.xml
          dragonfly/script/
          dragonfly/script/dragonfly.js
          dragonfly/style/
          dragonfly/style/dragonfly.css
          LAYOUT
          unzip -Z1 "$ARCHIVE" | sort > /tmp/actual-layout
          sort -o /tmp/expected-layout /tmp/expected-layout
          if ! diff -u /tmp/expected-layout /tmp/actual-layout; then
            echo "archive layout does not match the layout the browser stages" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
          ARCHIVE: ${{ steps.name.outputs.archive }}
        run: |
          set -eu
          # GitHub generates the notes. What a reader wants on a release page is
          # what changed and a link to the diff, which GitHub assembles from the
          # merged pull requests; hand-written notes here competed with that and
          # said less. How to verify a download is documented in README.md, which
          # is where it belongs and where it survives being read later.
          gh release create "$TAG" "$ARCHIVE" \
            --title "Opera Dragonfly $VERSION" \
            --generate-notes
