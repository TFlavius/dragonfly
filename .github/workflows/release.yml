# Publish a verifiable release archive of the client bundle.
#
# The browser fetches the release metadata from api.github.com over TLS, takes
# the asset's `digest` field and refuses to install anything whose SHA-256 does
# not match it. That digest is computed by GitHub when the asset is uploaded,
# not supplied here and not carried alongside the archive: an archive and a
# checksum published by the same uploader are attested by the same party, which
# is worth nothing. Nothing in this workflow may therefore write a checksum of
# its own into the release, or the browser would be invited to trust it.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # only to create the release and upload its asset

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Name the release
        id: name
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=dragonfly-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        run: ./build.sh --revision "${{ steps.name.outputs.version }}" -t "${{ steps.name.outputs.tag }}"

      - name: Assemble the archive
        id: assemble
        run: |
          set -eu
          version='${{ steps.name.outputs.version }}'
          archive='${{ steps.name.outputs.archive }}'

          # Exactly the files the browser stages, in the layout it stages them
          # in, so that unpacking this over an installed client replaces it
          # rather than merging into it. defs/ and fall-back-urls.json are build
          # products the client does not read at run time and are left out.
          staging="$(mktemp -d)/dragonfly"
          mkdir -p "$staging/script" "$staging/style"
          cp build/AUTHORS            "$staging/AUTHORS"
          cp build/client-en.xml      "$staging/client-en.xml"
          cp build/client.xml         "$staging/client.xml"
          cp build/script/dragonfly.js "$staging/script/dragonfly.js"
          cp build/style/dragonfly.css "$staging/style/dragonfly.css"
          # Named Apache-2.0 rather than LICENSE, because that is the name the
          # browser's bundled copy carries and the two layouts have to agree.
          cp LICENSE                  "$staging/Apache-2.0"

          # A rebuild of the same tag should produce the same bytes, so the
          # archive takes its timestamps from the tagged commit rather than from
          # the clock, and -X drops the extra attributes that vary by runner.
          stamp="$(git log -1 --format=%cd --date=format:%Y%m%d%H%M.%S)"
          find "$staging" -exec touch -t "$stamp" {} +

          ( cd "$(dirname "$staging")" && zip -X -r -q "$OLDPWD/$archive" dragonfly )

          echo "--- archive contents ---"
          unzip -l "$archive"
          echo "sha256: $(sha256sum "$archive" | cut -d' ' -f1)"

      - name: Check the archive against the staged layout
        run: |
          set -eu
          archive='${{ steps.name.outputs.archive }}'
          expected="dragonfly/
          dragonfly/Apache-2.0
          dragonfly/AUTHORS
          dragonfly/client-en.xml
          dragonfly/client.xml
          dragonfly/script/
          dragonfly/script/dragonfly.js
          dragonfly/style/
          dragonfly/style/dragonfly.css"
          actual="$(unzip -Z1 "$archive" | sort)"
          if [ "$(echo "$expected" | sed 's/^ *//' | sort)" != "$actual" ]; then
            echo "archive layout does not match the staged layout" >&2
            echo "expected:"; echo "$expected" | sed 's/^ *//' | sort
            echo "actual:";   echo "$actual"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.name.outputs.tag }}' \
            '${{ steps.name.outputs.archive }}' \
            --title 'Opera Dragonfly ${{ steps.name.outputs.version }}' \
            --notes 'Developer tools client bundle.

          Verify the download against the `digest` field this release advertises through the GitHub API, not against any checksum published in these notes:

              gh api repos/${{ github.repository }}/releases/tags/${{ steps.name.outputs.tag }} --jq ".assets[].digest"

          Unpack it over the `dragonfly` directory beside the browser'"'"'s resources, or in the profile to override that copy.'
